<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation editor demo</title>
<style>
  body { margin: 0; padding: 24px 16px 60px; background: #101a2e; color: #f5f1e8; font: 400 17px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
  h1 { font-size: 26px; margin: 0; } h2 { font-size: 16px; margin: 0 0 8px; color: #ffcc4d; letter-spacing: .06em; text-transform: uppercase; }
  pre { background: #0b1325; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0 0; font-size: 14px; }
</style>
<script type="module" src="./equation-editor.js"></script>
</head>
<body>
<main>
  <h1>Equation editor</h1>
  <section>
    <h2>One expression</h2>
    <equation-editor id="one" placeholder="Type or tap…"></equation-editor>
    <pre id="one-out">LaTeX appears here</pre>
  </section>
  <section>
    <h2>Notebook (Enter adds a line)</h2>
    <equation-notebook id="nb" placeholder="Write a step…"></equation-notebook>
    <pre id="nb-out">[]</pre>
  </section>
</main>
<script>
  one.addEventListener("input", () => { document.getElementById("one-out").textContent = one.value; });
  nb.addEventListener("input", () => { document.getElementById("nb-out").textContent = JSON.stringify(nb.value, null, 1); });
</script>
</body>
</html>
