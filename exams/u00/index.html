<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam · Unit 0 · exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
  /* Same world as the videos and the home page: navy graph paper, one yellow accent. */
  :root {
    --bg: #101a2e; --card: #18243d; --line: #2a3a5c; --ink: #f5f1e8; --muted: #9aa6bd;
    --yellow: #ffcc4d; --green: #4ade80; --red: #f87171; --blue: #60a5fa; --purple: #c084fc;
    --display: Poppins, "DejaVu Sans", sans-serif; --text: Inter, "DejaVu Sans", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 400 17px/1.55 var(--text); min-height: 100vh;
    background:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
  }
  main { max-width: 820px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
  a { color: var(--yellow); }
  .back { font-size: 14px; text-decoration: none; color: var(--muted); }
  .back:hover, .back:focus-visible { color: var(--yellow); }
  .eyebrow { margin-top: 22px; font: 600 13px var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 700 clamp(28px, 6vw, 42px)/1.15 var(--display); margin: 8px 0 18px; text-wrap: balance; }
  h1 .y { color: var(--yellow); }

  /* progress dots */
  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .dots button {
    width: 28px; height: 28px; border-radius: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font: 600 12px var(--display); cursor: pointer; padding: 0;
  }
  .dots button[data-s="first"] { background: var(--green); border-color: var(--green); color: var(--bg); }
  .dots button[data-s="retry"] { background: var(--yellow); border-color: var(--yellow); color: var(--bg); }
  .dots button[aria-current="step"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .dots button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px clamp(16px, 4vw, 28px); }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .level { font: 600 12px var(--text); letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .level[data-l="1"] { color: var(--green); } .level[data-l="2"] { color: var(--blue); }
  .level[data-l="3"] { color: var(--purple); } .level[data-l="4"] { color: var(--yellow); border-color: var(--yellow); }
  .prompt { margin: 18px 0 0; color: var(--muted); }
  .q {
    font: 600 clamp(26px, 6.2vw, 44px)/1.3 var(--display); margin: 14px 0 22px; text-align: center;
    overflow-x: auto; padding: 4px 0; letter-spacing: .02em; white-space: nowrap;
  }
  .q:focus { outline: none; }
  sup { font-size: .6em; vertical-align: .55em; line-height: 0; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .12em; }
  .frac .top { padding: .04em .25em .2em; border-bottom: .07em solid currentColor; }
  .frac .bot { padding: .2em .25em .04em; }


  /* work area (equation editor) */
  .pad { margin: 0 0 18px; }
  .padbtn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; cursor: pointer;
    background: transparent; color: var(--yellow); border: 2px dashed var(--line); font: 600 16px var(--text); text-align: left; }
  .padbtn:hover, .padbtn:focus-visible { border-color: var(--yellow); outline: none; }
  .padbtn .chev { transition: transform .15s; } .padbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .padbody { margin-top: 10px; }
  equation-notebook { --eq-panel: #101a2e; --eq-bg: #0b1325; --eq-size: clamp(22px, 5.5vw, 30px); }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .options { grid-template-columns: 1fr; } }
  .opt {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; cursor: pointer; text-align: left;
    background: #101a2e; border: 2px solid var(--line); color: var(--ink); font: 600 24px var(--display);
    font-variant-numeric: tabular-nums; min-height: 64px;
  }
  .opt .k { font: 600 13px var(--text); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--line); color: var(--ink); flex: none; }
  .opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--yellow); outline: none; }
  .opt[data-r="wrong"] { border-color: var(--red); background: rgba(248,113,113,.12); color: var(--red); cursor: default; }
  .opt[data-r="wrong"] .k { background: var(--red); color: var(--bg); }
  .opt[data-r="right"] { border-color: var(--green); background: rgba(74,222,128,.14); color: var(--green); cursor: default; }
  .opt[data-r="right"] .k { background: var(--green); color: var(--bg); }
  .opt:disabled:not([data-r]) { opacity: .45; cursor: default; }

  .answer { display: grid; gap: 10px; }
  .answer label { font: 600 14px var(--text); color: var(--muted); letter-spacing: .04em; }
  .answer equation-editor { --eq-panel: #101a2e; --eq-bg: #0b1325; --eq-size: clamp(24px, 6vw, 32px); }
  .answer .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .answer[data-r="right"] equation-editor { outline: 2px solid var(--green); border-radius: 12px; }
  .answer[data-r="wrong"] equation-editor { outline: 2px solid var(--red); border-radius: 12px; }
  /* select all that apply */
  .opt[aria-pressed="true"] { border-color: var(--yellow); background: rgba(255,204,77,.10); }
  .opt .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font: 700 15px var(--text); color: var(--bg); }
  .opt[aria-pressed="true"] .box { background: var(--yellow); border-color: var(--yellow); }
  .opt[aria-pressed="true"] .box::after { content: "✓"; }
  .opt.choice { font-size: 20px; }
  [hidden] { display: none !important; }
  .opt .why { display: block; font: 400 14px/1.35 var(--text); color: var(--red); margin-top: 4px; }
  /* matching */
  .pairs { display: grid; gap: 10px; margin: 0 0 4px; }
  .pair { display: grid; grid-template-columns: 1fr minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: #101a2e; }
  @media (max-width: 520px) { .pair { grid-template-columns: 1fr; } }
  .pair .l { font: 600 20px var(--display); }
  .pair select { width: 100%; font: 600 16px var(--text); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 10px; }
  .pair select:focus-visible { outline: none; border-color: var(--yellow); }
  .pair[data-r="wrong"] { border-color: var(--red); } .pair[data-r="right"] { border-color: var(--green); }
  .pair .why { grid-column: 1 / -1; color: var(--red); font-size: 14px; }
  .note.warn { border-color: var(--yellow); } .note.warn strong { color: var(--yellow); }
  .fb { margin-top: 18px; }
  .note { border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; border: 1px solid var(--line); background: #101a2e; }
  .note.bad { border-color: var(--red); } .note.good { border-color: var(--green); }
  .note strong { display: block; margin-bottom: 2px; }
  .note.bad strong { color: var(--red); } .note.good strong { color: var(--green); }
  .vid { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .btn {
    font: 600 16px var(--text); border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 2px solid var(--yellow);
    background: var(--yellow); color: var(--bg);
  }
  .btn.ghost { background: transparent; color: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .link { background: none; border: 0; color: var(--yellow); font: 500 15px var(--text); cursor: pointer; padding: 6px 0; text-decoration: underline; }

  .score { font: 700 clamp(44px, 12vw, 76px)/1 var(--display); color: var(--yellow); margin: 10px 0 4px; }
  .score small { font-size: .4em; color: var(--muted); font-weight: 600; }
  .bylevel { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
  .bylevel li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #101a2e; border: 1px solid var(--line); }
  footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* exam only: no right/wrong colours while answering */
  .dots button[data-a="1"] { background: var(--blue); border-color: var(--blue); color: var(--bg); }
  .hl { background: rgba(255,204,77,.22); border-radius: 6px; padding: 0 .12em; }
  .intro ul { padding-left: 1.2em; margin: 12px 0 18px; } .intro li { margin: 4px 0; }
  .nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .opt[data-pick="1"] { border-color: var(--yellow); background: rgba(255,204,77,.10); }
  .opt[data-pick="1"] .k { background: var(--yellow); color: var(--bg); }
  .pair[data-set="1"] { border-color: var(--blue); }
  .rv { margin: 14px 0 0; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  .rv > summary { cursor: pointer; list-style: none; padding: 14px 18px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .rv > summary::-webkit-details-marker { display: none; }
  .rv .mark { font: 700 15px var(--display); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .rv[data-ok="1"] { border-color: rgba(74,222,128,.45); } .rv[data-ok="1"] .mark { background: var(--green); color: var(--bg); }
  .rv[data-ok="0"] { border-color: rgba(248,113,113,.55); } .rv[data-ok="0"] .mark { background: var(--red); color: var(--bg); }
  .rv .body { padding: 0 18px 18px; }
  .rv .qline { font: 600 22px var(--display); margin: 6px 0 12px; overflow-x: auto; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0; }
  .kv dt { color: var(--muted); font-size: 14px; } .kv dd { margin: 0; font-weight: 600; }
  .kv dd.bad { color: var(--red); } .kv dd.good { color: var(--green); }
  .steps { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .steps li { background: #101a2e; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .steps .ln { font: 600 20px var(--display); overflow-x: auto; white-space: nowrap; }
  .steps .sy { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .steps li[data-ok="1"] .sy::before { content: "✓ "; color: var(--green); } .steps li[data-ok="0"] .sy::before { content: "✗ "; color: var(--red); }
  .blocks { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
  .blocks li b { white-space: nowrap; }
  .blocks li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #101a2e; border: 1px solid var(--line); }
  .verdict.pass { border-color: var(--green); } .verdict.pass strong { color: var(--green); }
  .verdict.fail strong { color: var(--yellow); }
  .vidhead { margin: 12px 0 6px; font-weight: 600; }
</style>
</head>

<script>
const DATA = {"unit":"0","title":"Unit 0 exam","setId":"u00-exam","levels":{"1":"Warm-up","2":"Tricky","3":"Challenging","4":"Boss level"},"pass":0.9,"draw":{"total":20,"boss_per_block":1},"blocks":[{"id":"0.1.1","name":"Order of operations"},{"id":"0.1.2","name":"Signed numbers"},{"id":"0.2.1","name":"Commutative and associative properties"},{"id":"0.2.2","name":"Distributive property"},{"id":"0.3","name":"Parts of an expression"},{"id":"0.4","name":"Combining like terms"},{"id":"0.5","name":"Translating words into expressions"}],"questions":[{"id":"ex01","level":1,"prompt":"","q":"18 − 6 ÷ 3 + 3","aria":"18 − 6 ÷ 3 + 3","input":"num","answer":"19","aHtml":"19","mistakes":[{"v":"7","why":"You subtracted 18 − 6 first, but division comes before subtraction."},{"v":"17","why":"You added 3 + 3 first, but addition comes last."},{"v":"13","why":"You added 2 + 3 before subtracting. Subtraction and addition share a level: left to right."}],"block":"0.1.1","blockName":"Order of operations","solution":{"steps":[{"line":"18 − <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">6 ÷ 3</span> + 3","say":"No parentheses or exponents, so division comes first: 6 ÷ 3 = 2."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">18 − 2</span> + 3","say":"Subtraction and addition share a level, so go left to right: 18 − 2 = 16."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">16 + 3</span>","say":"Last, 16 + 3 = 19."},{"line":"19","say":""}]}},{"id":"ex02","level":2,"prompt":"","q":"4 + 2 × 3<sup>2</sup>","aria":"4 + 2 × 3 to the power of 2","input":"num","answer":"22","aHtml":"22","mistakes":[{"v":"54","why":"You added 4 + 2 first, but addition comes last."},{"v":"40","why":"You squared the whole product 2 × 3. The exponent belongs only to the 3."},{"v":"16","why":"You multiplied 3 by 2 instead of squaring it."}],"block":"0.1.1","blockName":"Order of operations","solution":{"steps":[{"line":"4 + 2 × <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">3<sup>2</sup></span>","say":"The exponent comes first, and it only touches the 3: 3² = 9."},{"line":"4 + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">2 × 9</span>","say":"Then multiplication: 2 × 9 = 18."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4 + 18</span>","say":"Last, 4 + 18 = 22."},{"line":"22","say":""}]}},{"id":"ex03","level":2,"prompt":"","q":"(2 + 3)<sup>2</sup> − 2 × 5","aria":"(2 + 3) to the power of 2 − 2 × 5","input":"num","answer":"15","aHtml":"15","mistakes":[{"v":"1","why":"You squared only the 3. The parentheses make 2 + 3 the base."},{"v":"0","why":"You multiplied by 2 instead of squaring."},{"v":"115","why":"You subtracted 25 − 2 before multiplying. Multiplication comes before subtraction."}],"block":"0.1.1","blockName":"Order of operations","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(2 + 3)</span><sup>2</sup> − 2 × 5","say":"Parentheses first: 2 + 3 = 5."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">5<sup>2</sup></span> − 2 × 5","say":"Then the exponent: 5² = 25."},{"line":"25 − <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">2 × 5</span>","say":"Then multiplication: 2 × 5 = 10."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">25 − 10</span>","say":"Last, 25 − 10 = 15."},{"line":"15","say":""}]}},{"id":"ex04","level":2,"prompt":"","q":"−4<sup>2</sup> + 20","aria":"−4 to the power of 2 + 20","input":"num","answer":"4","aHtml":"4","mistakes":[{"v":"36","why":"You squared the negative sign too. Without parentheses, the exponent only touches the 4."},{"v":"12","why":"You multiplied 4 by 2 instead of squaring it."},{"v":"16","why":"You forgot to square the 4."}],"block":"0.1.1","blockName":"Order of operations","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−4<sup>2</sup></span> + 20","say":"With no parentheses, the exponent only touches the "hl c-yellow\" data-at=\"1\" data-out=\"None\">−3(4)</span> − 4(−3) − (−9)","say":"Now the multiplications. Negative three times four is negative twelve."},{"line":"−12 − <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4(−3)</span> − (−9)","say":"Four times negative three is also negative twelve."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−12 − (−12)</span> − (−9)","say":"Left to right. Negative twelve minus negative twelve is the same as negative twelve plus twelve, which is zero."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">0 − (−9)</span>","say":"Finally, zero minus negative nine is zero plus nine. That's nine."},{"line":"9","say":""}]}},{"id":"ex20","level":4,"prompt":"Evaluate the expression when x = −3.","q":"(x − 1)<sup>2</sup> − 3x(x + 2)","aria":"(x − 1) to the power of 2 − 3x(x + 2)","input":"num","answer":"7","aHtml":"7","mistakes":[{"v":"-13","why":"You squared only the 1. The parentheses (x − 1) are the base."},{"v":"-9","why":"You multiplied 3x by only the first x. The parentheses (x + 2) multiply the whole thing."},{"v":"25","why":"You changed the minus before 3x(x + 2) into a plus."}],"block":"0.1.2","blockName":"Signed numbers","solution":{"steps":[{"line":"(<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x</span> − 1)<sup>2</sup> − 3<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x</span>(<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x</span> + 2)","say":"Replace every x with negative three, in parentheses."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">((−3) − 1)</span><sup>2</sup> − 3(−3)((−3) + 2)","say":"Work inside the first parentheses. Negative three minus one is negative four."},{"line":"(−4)<sup>2</sup> − 3(−3)<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">((−3) + 2)</span>","say":"Now the second parentheses. Negative three plus two is negative one."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(−4)<sup>2</sup></span> − 3(−3)(−1)","say":"Exponent next. Negative four, squared, is sixteen."},{"line":"16 − <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">3(−3)</span>(−1)","say":"Then multiplication, left to right. Three times negative three is negative nine."},{"line":"16 − <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(−9)(−1)</span>","say":"Negative nine times negative one is nine."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">16 − 9</span>","say":"Finally, sixteen minus nine is seven."},{"line":"7","say":""}]}},{"id":"ex21","level":1,"prompt":"Which property is shown?","q":"(2 + 9) + 5 = 2 + (9 + 5)","aria":"(2 + 9) + 5 = 2 + (9 + 5)","options":[{"v":"Associative","ok":true,"why":""},{"v":"Commutative","ok":false,"why":"The numbers did not trade places: 2, 9, 5 is the same order on both sides."},{"v":"Distributive","ok":false,"why":"Distributive spreads a multiplication over a sum. Here everything is addition."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(2 + 9)</span> + 5 = 2 + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(9 + 5)</span>","say":"The numbers are in the same order on both sides: 2, 9, 5. What moved are the parentheses."},{"line":"11 + 5 = 2 + 14","say":"Both sides equal 16. Regrouping is the associative property."}]}},{"id":"ex22","level":2,"prompt":"Use the properties to find the value.","q":"50 × 17 × 2","aria":"50 × 17 × 2","input":"num","answer":"1700","aHtml":"1700","mistakes":[{"v":"134","why":"You added 50 and 17 instead of multiplying."},{"v":"852","why":"You added the 2 instead of multiplying by it."},{"v":"117","why":"You multiplied 50 × 2 but added the 17 instead of multiplying by it."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"50 × <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">17 × 2</span>","say":"50 and 2 make 100, so let's put them together. The commutative property lets us swap the 17 and the 2."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">50 × 2</span> × 17","say":"The associative property lets us group the 50 with the 2."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(50 × 2)</span> × 17","say":"50 × 2 = 100."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">100 × 17</span>","say":"100 × 17 = 1700."},{"line":"1700","say":""}]}},{"id":"ex23","level":2,"prompt":"Select all the true statements.","q":"","aria":"","pick":"multi","options":[{"v":"x + 8 = 8 + x","ok":true,"why":"Addition is commutative: the order doesn't matter."},{"v":"x − 8 = 8 − x","ok":false,"why":"Subtraction is not commutative. For x = 10: x − 8 = 2, but 8 − x = −2."},{"v":"4 · y = y · 4","ok":true,"why":"Multiplication is commutative: the order doesn't matter."},{"v":"y ÷ 4 = 4 ÷ y","ok":false,"why":"Division is not commutative. For y = 8: y ÷ 4 = 2, but 4 ÷ y is one half."},{"v":"6 − 2 = 2 − 6","ok":false,"why":"6 − 2 = 4, but 2 − 6 = −4."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"say":"Two of them are true: x plus eight equals eight plus x, and four times y equals y times four. Addition and multiplication are commutative. Subtraction and division are not.","items":[{"t":"x + 8 = 8 + x","ok":true,"note":"x plus eight equals eight plus x. Addition is commutative, so this is true."},{"t":"x − 8 = 8 − x","ok":false,"note":"Subtraction is not commutative. For x = 10: x − 8 = 2, but 8 − x = −2."},{"t":"4 · y = y · 4","ok":true,"note":"Four times y equals y times four. Multiplication is commutative, so this is true."},{"t":"y ÷ 4 = 4 ÷ y","ok":false,"note":"Division is not commutative. For y = 8: y ÷ 4 = 2, but 4 ÷ y is one half."},{"t":"6 − 2 = 2 − 6","ok":false,"note":"6 − 2 = 4, but 2 − 6 = −4."}]}},{"id":"ex24","level":2,"prompt":"Which property is shown?","q":"(a · b) · 6 = 6 · (a · b)","aria":"(a · b) · 6 = 6 · (a · b)","options":[{"v":"Commutative","ok":true,"why":""},{"v":"Associative","ok":false,"why":"Associative changes which factors are grouped. Here the group (a · b) is the same on both sides."},{"v":"Distributive","ok":false,"why":"Distributive needs a sum inside, like 6(a + b). Here it's a product."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(a · b)</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">6</span> = <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">6</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(a · b)</span>","say":"There are parentheses, but the group (a · b) never opens. It stays together as one factor."},{"line":"ab · 6 = 6 · ab","say":"The factor 6 and the whole group traded places. Swapping the order is the commutative property."}]}},{"id":"ex25","level":3,"prompt":"Use the properties to find the value.","q":"38 + 47 + 62","aria":"38 + 47 + 62","input":"num","answer":"147","aHtml":"147","mistakes":[{"v":"100","why":"You forgot to add the 47."},{"v":"53","why":"You subtracted the 47 instead of adding it."},{"v":"137","why":"You added 38 + 62 and got 90, but it is 100."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"38 + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">47 + 62</span>","say":"38 and 62 make 100, so let's put them together. The commutative property lets us swap the 47 and the 62."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">38 + 62</span> + 47","say":"The associative property lets us group the 38 with the 62."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(38 + 62)</span> + 47","say":"38 + 62 = 100."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">100 + 47</span>","say":"100 + 47 = 147."},{"line":"147","say":""}]}},{"id":"ex26","level":3,"prompt":"Match each identity with the property it shows.","q":"","aria":"","pick":"match","rights":["Commutative","Associative"],"pairs":[{"l":"14 · 5 = 5 · 14","r":0,"why":"The factors swapped places."},{"l":"(a + 4) + b = a + (4 + b)","r":1,"why":"Same order; the parentheses moved."},{"l":"3 + (y + 8) = 3 + (8 + y)","r":0,"why":"The parentheses stayed; y and 8 swapped inside."},{"l":"(c · 6) · 2 = c · (6 · 2)","r":1,"why":"Same order of factors, new grouping."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"say":"Order changes mean commutative. Grouping changes mean associative. A group that moves as a whole is still a change of order.","items":[{"t":"14 · 5 = 5 · 14  →  Commutative","ok":true,"note":"Fourteen times five equals five times fourteen. The factors swap places, so it is commutative."},{"t":"(a + 4) + b = a + (4 + b)  →  Associative","ok":true,"note":"The quantity a plus four, plus b, equals a plus the quantity four plus b. Same order, the parentheses moved. Associative."},{"t":"3 + (y + 8) = 3 + (8 + y)  →  Commutative","ok":true,"note":"Three plus the quantity y plus eight equals three plus the quantity eight plus y. The parentheses stay where they are. Inside, y and eight swap. Commutative."},{"t":"(c · 6) · 2 = c · (6 · 2)  →  Associative","ok":true,"note":"The quantity c times six, times two, equals c times the quantity six times two. Same order, new grouping. Associative."}]}},{"id":"ex27","level":3,"prompt":"Which property is shown?","q":"4 · (x · 3) = (4 · x) · 3","aria":"4 · (x · 3) = (4 · x) · 3","options":[{"v":"Associative","ok":true,"why":""},{"v":"Distributive","ok":false,"why":"Distributive needs a sum inside, like 4(x + 3). Here it's x · 3, a product."},{"v":"Commutative","ok":false,"why":"The order is the same on both sides: 4, x, 3."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"4 · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(x · 3)</span> = <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(4 · x)</span> · 3","say":"Look inside the parentheses: there is no sum, only multiplication. The factors stay in the order 4, x, 3."},{"line":"12x = 12x","say":"Only the grouping changed, and both sides are 12x. That's the associative property."}]}},{"id":"ex28","level":3,"prompt":"Select all the true statements.","q":"","aria":"","pick":"multi","options":[{"v":"(12 − 5) − 3 = 12 − (5 − 3)","ok":false,"why":"Regrouping subtraction changes the answer: the left side is 4, the right side is 10."},{"v":"(2 · 9) · 5 = 2 · (9 · 5)","ok":true,"why":"Multiplication is associative: both sides are 90."},{"v":"(24 ÷ 6) ÷ 2 = 24 ÷ (6 ÷ 2)","ok":false,"why":"Regrouping division changes the answer: the left side is 2, the right side is 8."},{"v":"(8 + 3) + 7 = 8 + (3 + 7)","ok":true,"why":"Addition is associative: both sides are 18."},{"v":"7 − 3 = 3 − 7","ok":false,"why":"7 − 3 = 4, but 3 − 7 = −4."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"say":"Two of them are true: the multiplication regrouping and the addition regrouping. Regrouping subtraction or division changes the answer, and so does swapping the order of a subtraction.","items":[{"t":"(12 − 5) − 3 = 12 − (5 − 3)","ok":false,"note":"Regrouping subtraction changes the answer: the left side is 4, the right side is 10."},{"t":"(2 · 9) · 5 = 2 · (9 · 5)","ok":true,"note":"Two times nine, times five, and two times nine times five regrouped are both ninety. Multiplication is associative, so this is true."},{"t":"(24 ÷ 6) ÷ 2 = 24 ÷ (6 ÷ 2)","ok":false,"note":"Regrouping division changes the answer: the left side is 2, the right side is 8."},{"t":"(8 + 3) + 7 = 8 + (3 + 7)","ok":true,"note":"Eight plus three, plus seven, and eight plus the quantity three plus seven are both eighteen. Addition is associative, so this is true."},{"t":"7 − 3 = 3 − 7","ok":false,"note":"7 − 3 = 4, but 3 − 7 = −4."}]}},{"id":"ex29","level":4,"prompt":"Use the properties to find the value.","q":"8 × 17 × 125","aria":"8 × 17 × 125","input":"num","answer":"17000","aHtml":"17000","mistakes":[{"v":"261","why":"You added the 125 instead of multiplying by it."},{"v":"2261","why":"You added 8 and 125 instead of multiplying them."},{"v":"1000","why":"You forgot to multiply by 17."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"8 × <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">17 × 125</span>","say":"Eight and one hundred twenty-five make one thousand, so let's put them together. The commutative property lets us swap the seventeen and the one hundred twenty-five."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">8 × 125</span> × 17","say":"The associative property lets us group the eight with the one hundred twenty-five."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(8 × 125)</span> × 17","say":"Eight times one hundred twenty-five is one thousand."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">1000 × 17</span>","say":"One thousand times seventeen is seventeen thousand."},{"line":"17000","say":""}]}},{"id":"ex30","level":4,"prompt":"Which property is shown?","q":"(2 + 5) + x = x + (2 + 5)","aria":"(2 + 5) + x = x + (2 + 5)","options":[{"v":"Commutative","ok":true,"why":""},{"v":"Associative","ok":false,"why":"Associative changes which numbers are grouped together. Here (2 + 5) is grouped the same way on both sides."},{"v":"Distributive","ok":false,"why":"Distributive needs a multiplication over a sum. Here everything is addition."}],"block":"0.2.1","blockName":"Commutative and associative properties","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(2 + 5)</span> + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x</span> = <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x</span> + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(2 + 5)</span>","say":"There are parentheses, so associative is tempting. But look: the group 2 plus 5 never changes. It stays together."},{"line":"7 + x = x + 7","say":"The whole group and x simply traded places. Swapping the order is the commutative property."}]}},{"id":"ex31","level":1,"prompt":"Use the distributive property to expand.","q":"4(x + 6)","aria":"4(x + 6)","input":"expr","answer":"4x + 24","aHtml":"4x + 24","mistakes":[{"e":"4x + 6","why":"You multiplied only the x by 4. The 6 needs it too."},{"e":"4x + 10","why":"You added 4 + 6 instead of multiplying."},{"e":"x + 24","why":"You multiplied only the 6 by 4."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4(x + 6)</span>","say":"The 4 outside multiplies every term inside: 4 times x, plus 4 times 6."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4 · x + 4 · 6</span>","say":"4 times x is 4x, and 4 times 6 is 24."},{"line":"4x + 24","say":""}]}},{"id":"ex32","level":2,"prompt":"Use the distributive property to find the value.","q":"7 × 98","aria":"7 × 98","input":"num","answer":"686","aHtml":"686","mistakes":[{"v":"698","why":"You multiplied only the 100 by 7."},{"v":"714","why":"98 is 100 − 2, so subtract. Don't add."},{"v":"638","why":"You multiplied only the 90 by 7. The 8 needs the 7 too."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"7 × <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">98</span>","say":"98 is 100 − 2."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">7 × (100 − 2)</span>","say":"7 multiplies both parts: 7 × 100 − 7 × 2."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">7 × 100 − 7 × 2</span>","say":"7 × 100 = 700, and 7 × 2 = 14."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">700 − 14</span>","say":"700 − 14 = 686."},{"line":"686","say":""}]}},{"id":"ex33","level":2,"prompt":"Use the distributive property to expand.","q":"−2(x − 5)","aria":"−2(x − 5)","input":"expr","answer":"-2x + 10","aHtml":"−2x + 10","mistakes":[{"e":"-2x - 10","why":"(−2)(−5) is positive 10: negative times negative."},{"e":"-2x - 5","why":"You multiplied only the x by −2."},{"e":"-2x + 5","why":"You multiplied the −5 by −1 instead of by −2."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−2(x − 5)</span>","say":"−2 multiplies every term inside: (−2)(x) and (−2)(−5)."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(−2)(x) + (−2)(−5)</span>","say":"−2 times x is −2x. Negative times negative is positive: (−2)(−5) = 10."},{"line":"−2x + 10","say":""}]}},{"id":"ex34","level":2,"prompt":"Select all the expressions equal to 3(x + 4).","q":"","aria":"","pick":"multi","options":[{"v":"3x + 12","ok":true,"why":"3 · x = 3x and 3 · 4 = 12."},{"v":"3x + 4","ok":false,"why":"The 3 multiplies both terms: the 4 becomes 12."},{"v":"x · 3 + 12","ok":true,"why":"x · 3 is 3x: the same as 3x + 12."},{"v":"3x + 7","ok":false,"why":"You added 3 + 4 instead of multiplying."},{"v":"12 + 3x","ok":true,"why":"The same terms in another order: addition is commutative."}],"block":"0.2.2","blockName":"Distributive property","solution":{"say":"Three of them are equal: three x plus twelve, x times three plus twelve, and twelve plus three x. The three multiplies both terms inside the parentheses.","items":[{"t":"3x + 12","ok":true,"note":"Three x plus twelve. Three times x is three x, and three times four is twelve. Right."},{"t":"3x + 4","ok":false,"note":"The 3 multiplies both terms: the 4 becomes 12."},{"t":"x · 3 + 12","ok":true,"note":"x times three plus twelve. X times three is three x, so this is three x plus twelve. Right."},{"t":"3x + 7","ok":false,"note":"You added 3 + 4 instead of multiplying."},{"t":"12 + 3x","ok":true,"note":"Twelve plus three x has the same terms in another order. Right."}]}},{"id":"ex35","level":3,"prompt":"Use the distributive property to expand.","q":"−3(2x − 4y + 1)","aria":"−3(2x − 4y + 1)","input":"expr","answer":"-6x + 12y - 3","aHtml":"−6x + 12y − 3","mistakes":[{"e":"-6x - 12y - 3","why":"(−3)(−4y) is positive 12y: negative times negative."},{"e":"-6x + 12y + 1","why":"The −3 multiplies the last term too: (−3)(1) = −3."},{"e":"-6x - 4y - 3","why":"The −3 multiplies the −4y too: (−3)(−4y) = 12y."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−3(2x − 4y + 1)</span>","say":"−3 multiplies every term inside: (−3)(2x), (−3)(−4y) and (−3)(1)."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(−3)(2x) + (−3)(−4y) + (−3)(1)</span>","say":"(−3)(2x) = −6x. Negative times negative is positive: (−3)(−4y) = 12y. And (−3)(1) = −3."},{"line":"−6x + 12y − 3","say":""}]}},{"id":"ex36","level":3,"prompt":"Use the distributive property to expand.","q":"x(3x − 7)","aria":"x(3x − 7)","input":"expr","answer":"3x^2 - 7x","aHtml":"3x<sup>2</sup> − 7x","mistakes":[{"e":"3x^2 - 7","why":"You multiplied only the first term by x."},{"e":"3x^2 + 7x","why":"x · (−7) is −7x: the minus sign stays."},{"e":"3x - 7x","why":"x · 3x is 3x², not 3x: multiplying x by x makes x²."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x(3x − 7)</span>","say":"x multiplies every term inside: x · 3x and x · (−7)."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x · 3x + x · (−7)</span>","say":"x · 3x = 3x², and x · (−7) = −7x."},{"line":"3x<sup>2</sup> − 7x","say":""}]}},{"id":"ex37","level":3,"prompt":"Use the distributive property backwards to find the value.","q":"13 × 8 + 13 × 12","aria":"13 × 8 + 13 × 12","input":"num","answer":"260","aHtml":"260","mistakes":[{"v":"116","why":"You factored the 13 out of only the first product."},{"v":"1248","why":"You multiplied 8 by 12 instead of adding the parts."},{"v":"520","why":"You added the two 13s. A common factor is pulled out once, not added."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">13 × 8 + 13 × 12</span>","say":"Both products have a 13, so factor it out: 13 × (8 + 12)."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">13 × (8 + 12)</span>","say":"8 + 12 = 20."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">13 × 20</span>","say":"13 × 20 = 260."},{"line":"260","say":""}]}},{"id":"ex38","level":3,"prompt":"Match each expression with its value.","q":"","aria":"","pick":"match","rights":["312","891","820","808"],"pairs":[{"l":"6 × 52","r":0,"why":"6 × 52 = 6 × (50 + 2) = 300 + 12 = 312."},{"l":"9 × 99","r":1,"why":"9 × 99 = 9 × (100 − 1) = 900 − 9 = 891."},{"l":"4 × 205","r":2,"why":"4 × 205 = 4 × (200 + 5) = 800 + 20 = 820."},{"l":"8 × 101","r":3,"why":"8 × 101 = 8 × (100 + 1) = 800 + 8 = 808."}],"block":"0.2.2","blockName":"Distributive property","solution":{"say":"Every expression now has its value. Split the harder number into a friendly sum or difference, and let the distributive property do the work.","items":[{"t":"6 × 52  →  312","ok":true,"note":"Six times fifty-two is six times the quantity fifty plus two. Three hundred plus twelve is three hundred twelve."},{"t":"9 × 99  →  891","ok":true,"note":"Nine times ninety-nine is nine times the quantity one hundred minus one. Nine hundred minus nine is eight hundred ninety-one."},{"t":"4 × 205  →  820","ok":true,"note":"Four times two hundred five is four times the quantity two hundred plus five. Eight hundred plus twenty is eight hundred twenty."},{"t":"8 × 101  →  808","ok":true,"note":"Eight times one hundred one is eight times the quantity one hundred plus one. Eight hundred plus eight is eight hundred eight."}]}},{"id":"ex39","level":4,"prompt":"Use the distributive property to expand.","q":"−2(3x<sup>2</sup> − 4x + 5)","aria":"−2(3x to the power of 2 − 4x + 5)","input":"expr","answer":"-6x^2 + 8x - 10","aHtml":"−6x<sup>2</sup> + 8x − 10","mistakes":[{"e":"-6x^2 - 8x - 10","why":"Negative times negative is positive: (−2)(−4x) = +8x."},{"e":"-6x^2 + 8x + 5","why":"The −2 multiplies the last term too: (−2)(5) = −10."},{"e":"6x^2 + 8x - 10","why":"(−2)(3x²) is −6x², not +6x²: the minus sign matters."}],"block":"0.2.2","blockName":"Distributive property","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−2(3x<sup>2</sup> − 4x + 5)</span>","say":"Negative two multiplies every term inside the parentheses. Negative two times three x squared, negative two times negative four x, and negative two times five."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(−2)(3x<sup>2</sup>) + (−2)(−4x) + (−2)(5)</span>","say":"Negative two times three x squared is negative six x squared. Negative times negative is positive, so negative two times negative four x is eight x. And negative two times five is negative ten."},{"line":"−6x<sup>2</sup> + 8x − 10","say":""}]}},{"id":"ex40","level":4,"prompt":"Select all the expressions equal to −3(x − 2).","q":"","aria":"","pick":"multi","options":[{"v":"−3x + 6","ok":true,"why":"(−3)(x) = −3x and (−3)(−2) = +6."},{"v":"−3x − 6","ok":false,"why":"Negative times negative is positive: the 6 is +6."},{"v":"6 − 3x","ok":true,"why":"The same terms in another order: −3x + 6 = 6 − 3x."},{"v":"−3x − 2","ok":false,"why":"The −3 multiplies both terms: the −2 becomes +6."},{"v":"−(3x − 6)","ok":true,"why":"The minus sign changes the sign of both terms: −3x + 6."},{"v":"3(2 − x)","ok":true,"why":"3(2 − x) = 6 − 3x, the same as −3x + 6."}],"block":"0.2.2","blockName":"Distributive property","solution":{"say":"Four of them are equal: negative three x plus six, six minus three x, the opposite of the quantity three x minus six, and three times the quantity two minus x. The negative three multiplies both terms, and the minus times minus makes plus six.","items":[{"t":"−3x + 6","ok":true,"note":"Negative three x plus six. Negative three times x is negative three x, and negative three times negative two is positive six. Right."},{"t":"−3x − 6","ok":false,"note":"Negative times negative is positive: the 6 is +6."},{"t":"6 − 3x","ok":true,"note":"Six minus three x has the same terms as negative three x plus six, in another order. Right."},{"t":"−3x − 2","ok":false,"note":"The −3 multiplies both terms: the −2 becomes +6."},{"t":"−(3x − 6)","ok":true,"note":"The opposite of the quantity three x minus six changes both signs. That is negative three x plus six. Right."},{"t":"3(2 − x)","ok":true,"note":"Three times the quantity two minus x is six minus three x. Right."}]}},{"id":"ex41","level":1,"prompt":"How many terms does this expression have?","q":"8y − 3x + 5","aria":"8y − 3x + 5","input":"num","answer":"3","aHtml":"3","mistakes":[{"v":"1","why":"The plus and minus signs separate the pieces, so there is more than one term."},{"v":"5","why":"8, y, 3, x and 5 are numbers and letters, not pieces separated by + or −. 8y is a single term."},{"v":"7","why":"The plus and minus signs separate the terms; they are not terms themselves."}],"block":"0.3","blockName":"Parts of an expression","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">8y</span> − 3x + 5","say":"Terms are the pieces that are added or subtracted. The first term is 8y."},{"line":"8y <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− 3x</span> + 5","say":"The second term is −3x. The minus sign belongs to it."},{"line":"8y − 3x <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">+ 5</span>","say":"The last term is +5. Nothing else is added or subtracted, so there are 3 terms."},{"line":"3 terms","say":""}]}},{"id":"ex42","level":2,"prompt":"What is the constant term?","q":"−x<sup>2</sup> + 3x − 11","aria":"−x to the power of 2 + 3x − 11","input":"num","answer":"-11","aHtml":"−11","mistakes":[{"v":"11","why":"The minus sign belongs to the term, so the constant is −11, not 11."},{"v":"3","why":"3 is the coefficient of 3x, a term with a variable. The constant has no variable."},{"v":"-9","why":"You added every number. The constant is only the term with no variable."}],"block":"0.3","blockName":"Parts of an expression","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−x<sup>2</sup></span> + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">3x</span> − 11","say":"The terms with a variable are not constants: −x² and 3x both have an x."},{"line":"−x<sup>2</sup> + 3x <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− 11</span>","say":"The only term with no variable is −11. The minus sign belongs to it, so the constant is −11."},{"line":"−11","say":""}]}},{"id":"ex43","level":2,"prompt":"How many factors are multiplied in this term?","q":"5ab<sup>2</sup>","aria":"5ab to the power of 2","input":"num","answer":"4","aHtml":"4","mistakes":[{"v":"3","why":"b² means b · b, so it is two factors, not one."},{"v":"2","why":"The 5 is a factor too, and b appears twice."},{"v":"1","why":"A term is a product of several factors; this one has more than one."}],"block":"0.3","blockName":"Parts of an expression","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">5ab<sup>2</sup></span> = 5 · a · b<sup>2</sup>","say":"Factors are the things multiplied inside a term. Write it as a product: 5 times a times b squared."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">5</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">a</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">b</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">b</span>","say":"Now b squared means b times b. So the factors are 5, a, b and b: 4 factors."},{"line":"4 factors","say":""}]}},{"id":"ex44","level":2,"prompt":"Select all the expressions with exactly 2 terms.","q":"","aria":"","pick":"multi","options":[{"v":"4x − 9","ok":true,"why":"Two pieces: 4x and −9."},{"v":"3(x + 2)","ok":false,"why":"It is one term: 3 times a group."},{"v":"5x<sup>2</sup> + 2x − 1","ok":false,"why":"Three terms: 5x², 2x and −1."},{"v":"−2y + 8","ok":true,"why":"Two pieces: −2y and 8."},{"v":"7 − 3(y + 1)","ok":true,"why":"Two terms: 7 and −3(y + 1). The group stays inside its term."}],"block":"0.3","blockName":"Parts of an expression","solution":{"say":"Three of them have exactly two terms: four x minus nine, negative two y plus eight, and seven minus three times the quantity y plus one. A product with a group is one term, whatever is inside the parentheses.","items":[{"t":"4x − 9","ok":true,"note":"Four x minus nine has two pieces: four x and negative nine. Two terms. Right."},{"t":"3(x + 2)","ok":false,"note":"It is one term: 3 times a group."},{"t":"5x<sup>2</sup> + 2x − 1","ok":false,"note":"Three terms: 5x², 2x and −1."},{"t":"−2y + 8","ok":true,"note":"Negative two y plus eight has two pieces. Two terms. Right."},{"t":"7 − 3(y + 1)","ok":true,"note":"Seven minus three times the quantity y plus one has two terms: seven, and negative three times the group. The plus inside the parentheses does not make a new term. Right."}]}},{"id":"ex45","level":3,"prompt":"What is the coefficient of the y term?","q":"4x<sup>2</sup> − 9y + xy","aria":"4x to the power of 2 − 9y + xy","input":"num","answer":"-9","aHtml":"−9","mistakes":[{"v":"9","why":"The minus sign belongs to the term, so the coefficient is −9, not 9."},{"v":"4","why":"4 is the coefficient of 4x², the first term, not of the y term."},{"v":"1","why":"xy is a different term, and its coefficient is 1. The y term is −9y."}],"block":"0.3","blockName":"Parts of an expression","solution":{"steps":[{"line":"4x<sup>2</sup> <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− 9y</span> + xy","say":"The y term is −9y. The minus sign belongs to it."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">−9y</span> = −9 · y","say":"The number multiplying y is 9, and the minus sign makes it negative: the coefficient is −9."},{"line":"−9","say":""}]}},{"id":"ex46","level":3,"prompt":"How many terms does this expression have?","q":"3(x − 2) + 4y − (y + 1)","aria":"3(x − 2) + 4y − (y + 1)","input":"num","answer":"3","aHtml":"3","mistakes":[{"v":"5","why":"Signs inside parentheses don't make new terms of the whole expression: each group stays inside its term."},{"v":"7","why":"Numbers and letters are not terms. Terms are separated by + or − outside the parentheses."},{"v":"1","why":"The plus and minus signs outside the parentheses separate the terms."}],"block":"0.3","blockName":"Parts of an expression","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">3(x − 2)</span> + 4y − (y + 1)","say":"A product with a group is one term, whatever is inside the parentheses. 3(x − 2) is the first term."},{"line":"3(x − 2) <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">+ 4y</span> − (y + 1)","say":"After the plus sign comes the second term, 4y."},{"line":"3(x − 2) + 4y <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− (y + 1)</span>","say":"After the minus sign comes the third term, −(y + 1). Nothing else is added or subtracted outside parentheses, so there are 3 terms."},{"line":"3 terms","say":""}]}},{"id":"ex47","level":3,"prompt":"Select all the terms with coefficient 5.","q":"","aria":"","pick":"multi","options":[{"v":"5x<sup>2</sup>","ok":true,"why":"The number multiplying x² is 5."},{"v":"5ab","ok":true,"why":"The number in front of the letters is 5."},{"v":"x<sup>5</sup>","ok":false,"why":"5 is the exponent here. The coefficient is the hidden 1."},{"v":"−5y","ok":false,"why":"The minus sign belongs to the term: the coefficient is −5."},{"v":"15z","ok":false,"why":"The coefficient is the whole number 15, not 5."}],"block":"0.3","blockName":"Parts of an expression","solution":{"say":"Two of them have coefficient five: five x squared and five a b. In x to the fifth the five is an exponent, and a minus sign or a bigger number changes the coefficient.","items":[{"t":"5x<sup>2</sup>","ok":true,"note":"Five x squared. The number multiplying x squared is five. Right."},{"t":"5ab","ok":true,"note":"Five a b. The number in front of the letters is five. Right."},{"t":"x<sup>5</sup>","ok":false,"note":"5 is the exponent here. The coefficient is the hidden 1."},{"t":"−5y","ok":false,"note":"The minus sign belongs to the term: the coefficient is −5."},{"t":"15z","ok":false,"note":"The coefficient is the whole number 15, not 5."}]}},{"id":"ex48","level":3,"prompt":"Match each expression with its number of terms.","q":"","aria":"","pick":"match","rights":["2","1","3","4"],"pairs":[{"l":"4x − 7","r":0,"why":"Two pieces: 4x and −7."},{"l":"5(x + 3)","r":1,"why":"A number times a group is one term."},{"l":"a + b − c","r":2,"why":"Three pieces: a, b and −c."},{"l":"6x<sup>2</sup> + 2x − 8 + y","r":3,"why":"Four pieces: 6x², 2x, −8 and y."},{"l":"−x","r":1,"why":"A single piece. The minus sign belongs to the term."}],"block":"0.3","blockName":"Parts of an expression","solution":{"say":"Every expression now has its number of terms. Count the pieces separated by plus and minus signs outside parentheses. A product with a group is one term, and so is a single piece with a minus sign.","items":[{"t":"4x − 7  →  2","ok":true,"note":"Four x minus seven has two pieces, so two terms."},{"t":"5(x + 3)  →  1","ok":true,"note":"Five times the quantity x plus three is one product, so one term."},{"t":"a + b − c  →  3","ok":true,"note":"A plus b minus c has three pieces, so three terms."},{"t":"6x<sup>2</sup> + 2x − 8 + y  →  4","ok":true,"note":"Six x squared plus two x minus eight plus y has four pieces, so four terms."},{"t":"−x  →  1","ok":true,"note":"Negative x is a single piece, so one term."}]}},{"id":"ex49","level":4,"prompt":"How many factors are multiplied in this term?","q":"4m<sup>3</sup>(n − 2)","aria":"4m to the power of 3(n − 2)","input":"num","answer":"5","aHtml":"5","mistakes":[{"v":"4","why":"m³ means m · m · m, so it is three factors, and the group (n − 2) is one factor."},{"v":"2","why":"The 4 is a factor, m appears three times, and the group is a factor too."},{"v":"1","why":"A term is a product of several factors; this one has more than one."}],"block":"0.3","blockName":"Parts of an expression","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4m<sup>3</sup>(n − 2)</span> = 4 · m<sup>3</sup> · (n − 2)","say":"Factors are the things multiplied inside a term. Write it as a product: four times m cubed times the group n minus two."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">m</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">m</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">m</span> · <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(n − 2)</span>","say":"Now m cubed means m times m times m, and the group counts as one factor. So the factors are four, m, m, m, and the group: five factors."},{"line":"5 factors","say":""}]}},{"id":"ex50","level":4,"prompt":"Select all the terms of 6 − 4a^2 + a − 2ab.","q":"","aria":"","pick":"multi","options":[{"v":"6","ok":true,"why":"The first piece: a constant term."},{"v":"−4a<sup>2</sup>","ok":true,"why":"The minus sign belongs to the term after it."},{"v":"4a<sup>2</sup>","ok":false,"why":"This leaves out the minus sign. The term is −4a²."},{"v":"a","ok":true,"why":"A single letter is a term: it is 1a."},{"v":"−2ab","ok":true,"why":"The minus sign belongs to the term."},{"v":"2ab","ok":false,"why":"This leaves out the minus sign. The term is −2ab."}],"block":"0.3","blockName":"Parts of an expression","solution":{"say":"Four of them are terms: six, negative four a squared, a, and negative two a b. Each term keeps the sign in front of it, and a letter on its own is a term with a hidden coefficient of one.","items":[{"t":"6","ok":true,"note":"Six. It is the first piece, a constant term. Right."},{"t":"−4a<sup>2</sup>","ok":true,"note":"Negative four a squared. The minus sign belongs to the term after it. Right."},{"t":"4a<sup>2</sup>","ok":false,"note":"This leaves out the minus sign. The term is −4a²."},{"t":"a","ok":true,"note":"a. A letter on its own is a term, with a hidden coefficient of one. Right."},{"t":"−2ab","ok":true,"note":"Negative two a b. The minus sign belongs to the term. Right."},{"t":"2ab","ok":false,"note":"This leaves out the minus sign. The term is −2ab."}]}},{"id":"ex51","level":1,"prompt":"Simplify by combining like terms.","q":"8x − 3x","aria":"8x − 3x","input":"expr","answer":"5x","aHtml":"5x","mistakes":[{"e":"5","why":"The x stays: it is part of the like terms, so the answer is 5x."},{"e":"11x","why":"It is 8x − 3x, so subtract the coefficients: 8 − 3, not 8 + 3."},{"e":"5x^2","why":"Combining like terms adds the coefficients; the variable part stays x."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">8x − 3x</span>","say":"Both terms have the same variable part, x. Combine the coefficients: 8 − 3 = 5, so 5x."},{"line":"5x","say":""}]}},{"id":"ex52","level":2,"prompt":"Simplify by combining like terms.","q":"4a + 7 − 6a − 2","aria":"4a + 7 − 6a − 2","input":"expr","answer":"-2a + 5","aHtml":"−2a + 5","mistakes":[{"e":"-2a + 9","why":"The constants are 7 and −2, so 7 − 2 = 5, not 9."},{"e":"2a + 5","why":"4a − 6a = −2a: the bigger coefficient, 6, is the negative one."},{"e":"-2a - 5","why":"The 7 is positive: 7 − 2 = 5."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4a + 7 − 6a − 2</span>","say":"Collect the like terms: the a terms are 4a and −6a, and the constants are 7 and −2."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(4a − 6a)</span> + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(7 − 2)</span>","say":"4a − 6a = −2a, and 7 − 2 = 5."},{"line":"−2a + 5","say":""}]}},{"id":"ex53","level":2,"prompt":"Select all the like terms of 3x^2y.","q":"","aria":"","pick":"multi","options":[{"v":"−x<sup>2</sup>y","ok":true,"why":"Same variable part, x²y. The coefficient doesn't matter."},{"v":"yx<sup>2</sup>","ok":true,"why":"Same letters with the same powers, in another order: x²y."},{"v":"3xy","ok":false,"why":"x is not x²: the exponents are different."},{"v":"3x<sup>2</sup>","ok":false,"why":"It has no y, so the variable part is different."},{"v":"y<sup>2</sup>x","ok":false,"why":"The powers are swapped: y²x is not x²y."}],"block":"0.4","blockName":"Combining like terms","solution":{"say":"Two of them are like terms of three x squared y: negative x squared y, and y x squared. Like terms have exactly the same letters with the same powers. The order of the letters and the number in front do not matter.","items":[{"t":"−x<sup>2</sup>y","ok":true,"note":"Negative x squared y. The variable part is x squared y, the same as in three x squared y. A like term."},{"t":"yx<sup>2</sup>","ok":true,"note":"y x squared. The same letters with the same powers in another order. A like term."},{"t":"3xy","ok":false,"note":"x is not x²: the exponents are different."},{"t":"3x<sup>2</sup>","ok":false,"note":"It has no y, so the variable part is different."},{"t":"y<sup>2</sup>x","ok":false,"note":"The powers are swapped: y²x is not x²y."}]}},{"id":"ex54","level":2,"prompt":"Simplify by combining like terms.","q":"4(x − 2) + 7x","aria":"4(x − 2) + 7x","input":"expr","answer":"11x - 8","aHtml":"11x − 8","mistakes":[{"e":"11x - 2","why":"The 4 multiplies both terms: 4 · (−2) = −8."},{"e":"11x + 8","why":"4 · (−2) is −8: positive times negative is negative."},{"e":"3x","why":"−8 is a constant, so it can't join the x terms."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4(x − 2)</span> + 7x","say":"Distribute first: 4 times x is 4x, and 4 times −2 is −8."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">4x</span> − 8 <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">+ 7x</span>","say":"Now combine the x terms: 4x + 7x = 11x. The −8 has no like term, so it stays."},{"line":"11x − 8","say":""}]}},{"id":"ex55","level":3,"prompt":"Simplify by combining like terms.","q":"6x<sup>2</sup> − 2x + 5 − 4x<sup>2</sup> + 7x − 9","aria":"6x to the power of 2 − 2x + 5 − 4x to the power of 2 + 7x − 9","input":"expr","answer":"2x^2 + 5x - 4","aHtml":"2x<sup>2</sup> + 5x − 4","mistakes":[{"e":"2x^2 + 5x + 4","why":"5 − 9 = −4, not +4."},{"e":"10x^2 + 5x - 4","why":"6x² − 4x² = 2x². The minus sign belongs to the 4x² term."},{"e":"2x^2 - 9x - 4","why":"−2x + 7x = 5x: the signs are different, so subtract the sizes."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">6x<sup>2</sup> − 2x + 5 − 4x<sup>2</sup> + 7x − 9</span>","say":"Sort the terms by their variable part: x² terms 6x² and −4x², x terms −2x and 7x, constants 5 and −9."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(6x<sup>2</sup> − 4x<sup>2</sup>)</span> + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(−2x + 7x)</span> + <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">(5 − 9)</span>","say":"6x² − 4x² = 2x², −2x + 7x = 5x, and 5 − 9 = −4."},{"line":"2x<sup>2</sup> + 5x − 4","say":""}]}},{"id":"ex56","level":3,"prompt":"Simplify by combining like terms.","q":"3(2x − 1) − 2(x − 4)","aria":"3(2x − 1) − 2(x − 4)","input":"expr","answer":"4x + 5","aHtml":"4x + 5","mistakes":[{"e":"4x - 11","why":"(−2)(−4) is +8: negative times negative is positive."},{"e":"4x + 11","why":"3 · (−1) is −3, not +3."},{"e":"4x - 7","why":"The −2 multiplies both terms: (−2)(−4) = +8."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">3(2x − 1)</span> <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− 2(x − 4)</span>","say":"Distribute both parts. 3(2x − 1) = 6x − 3. And −2(x − 4) = −2x + 8, since negative times negative is positive."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">6x − 3 − 2x + 8</span>","say":"Combine like terms: 6x − 2x = 4x, and −3 + 8 = 5."},{"line":"4x + 5","say":""}]}},{"id":"ex57","level":3,"prompt":"Select all the expressions equal to 2x + 6.","q":"","aria":"","pick":"multi","options":[{"v":"x + x + 6","ok":true,"why":"x + x = 2x."},{"v":"2(x + 3)","ok":true,"why":"2 · x = 2x and 2 · 3 = 6."},{"v":"x + 2 + x + 4","ok":true,"why":"x + x = 2x and 2 + 4 = 6."},{"v":"2x<sup>2</sup> + 6","ok":false,"why":"Combining like terms never changes the exponent: x + x is 2x, not 2x²."},{"v":"2(x + 6)","ok":false,"why":"The 2 multiplies both terms: 2(x + 6) = 2x + 12."}],"block":"0.4","blockName":"Combining like terms","solution":{"say":"Three of them equal two x plus six: x plus x plus six, two times the quantity x plus three, and x plus two plus x plus four. Combining like terms never changes the value, and the two multiplies both terms inside parentheses.","items":[{"t":"x + x + 6","ok":true,"note":"x plus x plus six. x plus x is two x. Right."},{"t":"2(x + 3)","ok":true,"note":"Two times the quantity x plus three. Two times x is two x, and two times three is six. Right."},{"t":"x + 2 + x + 4","ok":true,"note":"x plus two plus x plus four. The x terms make two x, and the constants make six. Right."},{"t":"2x<sup>2</sup> + 6","ok":false,"note":"Combining like terms never changes the exponent: x + x is 2x, not 2x²."},{"t":"2(x + 6)","ok":false,"note":"The 2 multiplies both terms: 2(x + 6) = 2x + 12."}]}},{"id":"ex58","level":3,"prompt":"Match each expression with its simplified form.","q":"","aria":"","pick":"match","rights":["8x","x<sup>3</sup>","4","4a"],"pairs":[{"l":"3x + 5x","r":0,"why":"3 + 5 = 8, and the x stays."},{"l":"x · x · x","r":1,"why":"Multiplying x by itself three times makes x³."},{"l":"7y − 7y + 4","r":2,"why":"7y − 7y = 0, so only the 4 is left."},{"l":"2(a + a)","r":3,"why":"a + a = 2a, and 2 · 2a = 4a."}],"block":"0.4","blockName":"Combining like terms","solution":{"say":"Every expression now has its simplified form. Adding like terms adds the coefficients; multiplying x by x by x makes x cubed.","items":[{"t":"3x + 5x  →  8x","ok":true,"note":"Three x plus five x. Three plus five is eight, so eight x."},{"t":"x · x · x  →  x<sup>3</sup>","ok":true,"note":"x times x times x. This is multiplication, so it is x cubed, not three x."},{"t":"7y − 7y + 4  →  4","ok":true,"note":"Seven y minus seven y is zero. Only the four is left."},{"t":"2(a + a)  →  4a","ok":true,"note":"Two times the quantity a plus a. A plus a is two a, and two times two a is four a."}]}},{"id":"ex59","level":4,"prompt":"Simplify by combining like terms.","q":"2(3x<sup>2</sup> − x) − (x<sup>2</sup> − 5x) + 4(x − 3)","aria":"2(3x to the power of 2 − x) − (x to the power of 2 − 5x) + 4(x − 3)","input":"expr","answer":"5x^2 + 7x - 12","aHtml":"5x<sup>2</sup> + 7x − 12","mistakes":[{"e":"5x^2 - 3x - 12","why":"The minus before (x² − 5x) changes both signs: −x² + 5x, not −x² − 5x."},{"e":"5x^2 + 7x - 3","why":"The 4 multiplies both terms: 4 · (−3) = −12."},{"e":"7x^2 + 7x - 12","why":"The minus before (x² − 5x) makes −x², not +x²."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">2(3x<sup>2</sup> − x)</span> <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− (x<sup>2</sup> − 5x)</span> <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">+ 4(x − 3)</span>","say":"Distribute all three parts. Two times three x squared minus x is six x squared minus two x. The minus sign in front of the second parentheses changes both signs: negative x squared plus five x. And four times x minus three is four x minus twelve."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">6x<sup>2</sup> − 2x − x<sup>2</sup> + 5x + 4x − 12</span>","say":"Now combine like terms. Six x squared minus x squared is five x squared. Negative two x plus five x plus four x is seven x. The constant is negative twelve."},{"line":"5x<sup>2</sup> + 7x − 12","say":""}]}},{"id":"ex60","level":4,"prompt":"Simplify by combining like terms.","q":"x(x + 3) − 2(x<sup>2</sup> − 4x) + 5x","aria":"x(x + 3) − 2(x to the power of 2 − 4x) + 5x","input":"expr","answer":"-x^2 + 16x","aHtml":"−x<sup>2</sup> + 16x","mistakes":[{"e":"-x^2","why":"(−2)(−4x) is +8x: negative times negative is positive."},{"e":"3x^2 + 16x","why":"−2 times x² is −2x², not +2x²."},{"e":"-x^2 + 4x","why":"The −2 multiplies both terms: (−2)(−4x) = 8x."}],"block":"0.4","blockName":"Combining like terms","solution":{"steps":[{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x(x + 3)</span> <span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">− 2(x<sup>2</sup> − 4x)</span> + 5x","say":"Distribute first. x times x plus three is x squared plus three x. Negative two times x squared minus four x is negative two x squared plus eight x, since negative times negative is positive."},{"line":"<span class=\"hl c-yellow\" data-at=\"1\" data-out=\"None\">x<sup>2</sup> + 3x − 2x<sup>2</sup> + 8x + 5x</span>","say":"Now combine like terms. x squared minus two x squared is negative x squared. Three x plus eight x plus five x is sixteen x."},{"line":"−x<
