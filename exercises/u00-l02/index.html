<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice 0.2 · Properties of Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
  /* Same world as the videos and the home page: navy graph paper, one yellow accent. */
  :root {
    --bg: #101a2e; --card: #18243d; --line: #2a3a5c; --ink: #f5f1e8; --muted: #9aa6bd;
    --yellow: #ffcc4d; --green: #4ade80; --red: #f87171; --blue: #60a5fa; --purple: #c084fc;
    --display: Poppins, "DejaVu Sans", sans-serif; --text: Inter, "DejaVu Sans", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 400 17px/1.55 var(--text); min-height: 100vh;
    background:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
  }
  main { max-width: 820px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
  a { color: var(--yellow); }
  .back { font-size: 14px; text-decoration: none; color: var(--muted); }
  .back:hover, .back:focus-visible { color: var(--yellow); }
  .eyebrow { margin-top: 22px; font: 600 13px var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 700 clamp(28px, 6vw, 42px)/1.15 var(--display); margin: 8px 0 18px; text-wrap: balance; }
  h1 .y { color: var(--yellow); }

  /* progress dots */
  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .dots button {
    width: 28px; height: 28px; border-radius: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font: 600 12px var(--display); cursor: pointer; padding: 0;
  }
  .dots button[data-s="first"] { background: var(--green); border-color: var(--green); color: var(--bg); }
  .dots button[data-s="retry"] { background: var(--yellow); border-color: var(--yellow); color: var(--bg); }
  .dots button[aria-current="step"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .dots button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px clamp(16px, 4vw, 28px); }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .level { font: 600 12px var(--text); letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .level[data-l="1"] { color: var(--green); } .level[data-l="2"] { color: var(--blue); }
  .level[data-l="3"] { color: var(--purple); } .level[data-l="4"] { color: var(--yellow); border-color: var(--yellow); }
  .prompt { margin: 18px 0 0; color: var(--muted); }
  .q {
    font: 600 clamp(26px, 6.2vw, 44px)/1.3 var(--display); margin: 14px 0 22px; text-align: center;
    overflow-x: auto; padding: 4px 0; letter-spacing: .02em; white-space: nowrap;
  }
  .q:focus { outline: none; }
  sup { font-size: .6em; vertical-align: .55em; line-height: 0; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .12em; }
  .frac .top { padding: .04em .25em .2em; border-bottom: .07em solid currentColor; }
  .frac .bot { padding: .2em .25em .04em; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .options { grid-template-columns: 1fr; } }
  .opt {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; cursor: pointer; text-align: left;
    background: #101a2e; border: 2px solid var(--line); color: var(--ink); font: 600 24px var(--display);
    font-variant-numeric: tabular-nums; min-height: 64px;
  }
  .opt .k { font: 600 13px var(--text); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--line); color: var(--ink); flex: none; }
  .opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--yellow); outline: none; }
  .opt[data-r="wrong"] { border-color: var(--red); background: rgba(248,113,113,.12); color: var(--red); cursor: default; }
  .opt[data-r="wrong"] .k { background: var(--red); color: var(--bg); }
  .opt[data-r="right"] { border-color: var(--green); background: rgba(74,222,128,.14); color: var(--green); cursor: default; }
  .opt[data-r="right"] .k { background: var(--green); color: var(--bg); }
  .opt:disabled:not([data-r]) { opacity: .45; cursor: default; }

  .fb { margin-top: 18px; }
  .note { border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; border: 1px solid var(--line); background: #101a2e; }
  .note.bad { border-color: var(--red); } .note.good { border-color: var(--green); }
  .note strong { display: block; margin-bottom: 2px; }
  .note.bad strong { color: var(--red); } .note.good strong { color: var(--green); }
  .vid { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .btn {
    font: 600 16px var(--text); border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 2px solid var(--yellow);
    background: var(--yellow); color: var(--bg);
  }
  .btn.ghost { background: transparent; color: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .link { background: none; border: 0; color: var(--yellow); font: 500 15px var(--text); cursor: pointer; padding: 6px 0; text-decoration: underline; }

  .score { font: 700 clamp(44px, 12vw, 76px)/1 var(--display); color: var(--yellow); margin: 10px 0 4px; }
  .score small { font-size: .4em; color: var(--muted); font-weight: 600; }
  .bylevel { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
  .bylevel li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #101a2e; border: 1px solid var(--line); }
  footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← All lessons</a>
  <div class="eyebrow" id="eyebrow"></div>
  <h1>Properties, <span class="y">put to work</span></h1>
  <ol class="dots" id="dots" aria-label="Exercises"></ol>
  <div id="app"></div>
  <footer>Pick the answer you think is right. A wrong answer shows you the mistake and plays a step-by-step video. Solution videos use an AI-generated voice.</footer>
</main>

<script>
const DATA = {"unit":"0.2","title":"Properties of Operations","setId":"u00-l02","levels":{"1":"Warm-up","2":"Tricky","3":"Challenging","4":"Boss level"},"exercises":[{"id":"ex01","n":1,"level":1,"prompt":"Which property is shown?","q":"7 + 9 = 9 + 7","aria":"7 + 9 = 9 + 7","options":[{"v":"Commutative","ok":true,"why":""},{"v":"Associative","ok":false,"why":"Associative is about grouping with parentheses. There are no parentheses here."},{"v":"Distributive","ok":false,"why":"Distributive needs a number multiplied by a sum, like 3(x + 2)."}]},{"id":"ex02","n":2,"level":1,"prompt":"Which property is shown?","q":"(6 × 5) × 2 = 6 × (5 × 2)","aria":"(6 × 5) × 2 = 6 × (5 × 2)","options":[{"v":"Associative","ok":true,"why":""},{"v":"Commutative","ok":false,"why":"The numbers did not trade places: 6, 5, 2 is the same order on both sides."},{"v":"Distributive","ok":false,"why":"Distributive spreads a multiplication over a sum. Here everything is multiplication."}]},{"id":"ex03","n":3,"level":1,"prompt":"Which property is shown?","q":"4(x + 3) = 4x + 12","aria":"4(x + 3) = 4x + 12","options":[{"v":"Distributive","ok":true,"why":""},{"v":"Commutative","ok":false,"why":"Nothing just traded places: the 4 multiplied each term of a sum."},{"v":"Associative","ok":false,"why":"Associative only moves parentheses. Here they disappear because the 4 multiplied each term."}]},{"id":"ex04","n":4,"level":1,"prompt":"Use the properties to find the value.","q":"25 × 13 × 4","aria":"25 × 13 × 4","options":[{"v":"1300","ok":true,"why":""},{"v":"377","ok":false,"why":"You added 25 and 4 instead of multiplying them."},{"v":"113","ok":false,"why":"You added the 13 instead of multiplying by it."},{"v":"325","ok":false,"why":"You forgot to multiply by 4."}]},{"id":"ex05","n":5,"level":1,"prompt":"Use the distributive property to expand.","q":"5(x + 2)","aria":"5(x + 2)","options":[{"v":"5x + 10","ok":true,"why":""},{"v":"5x + 2","ok":false,"why":"You multiplied only the x by 5. The 2 needs it too."},{"v":"5x + 7","ok":false,"why":"You added 5 + 2 instead of multiplying."},{"v":"x + 10","ok":false,"why":"You multiplied only the 2 by 5."}]},{"id":"ex06","n":6,"level":2,"prompt":"Which property is shown?","q":"x · 8 = 8x","aria":"x · 8 = 8x","options":[{"v":"Commutative","ok":true,"why":""},{"v":"Associative","ok":false,"why":"There is only one multiplication, so there is nothing to regroup."},{"v":"Distributive","ok":false,"why":"There is no sum for the 8 to be spread over."}]},{"id":"ex07","n":7,"level":2,"prompt":"Which property is shown?","q":"3 + (x + 7) = (3 + x) + 7","aria":"3 + (x + 7) = (3 + x) + 7","options":[{"v":"Associative","ok":true,"why":""},{"v":"Commutative","ok":false,"why":"It looks like something moved, but the order is the same: 3, x, 7. Only the parentheses moved."},{"v":"Distributive","ok":false,"why":"Nothing multiplies the parentheses; it's all addition."}]},{"id":"ex08","n":8,"level":2,"prompt":"Use the distributive property to expand.","q":"−3(x + 4)","aria":"−3(x + 4)","options":[{"v":"−3x − 12","ok":true,"why":""},{"v":"−3x + 12","ok":false,"why":"−3 · 4 is −12, not +12. The negative sign goes along."},{"v":"−3x + 4","ok":false,"why":"You multiplied only the x by −3."},{"v":"3x + 12","ok":false,"why":"You dropped the negative sign completely."}]},{"id":"ex09","n":9,"level":2,"prompt":"Use the distributive property to expand.","q":"7(2x − 1)","aria":"7(2x − 1)","options":[{"v":"14x − 7","ok":true,"why":""},{"v":"14x − 1","ok":false,"why":"You multiplied only the 2x by 7."},{"v":"9x − 7","ok":false,"why":"You added 7 + 2 instead of multiplying 7 · 2x."},{"v":"14x + 7","ok":false,"why":"7 · (−1) is −7. The minus sign stays."}]},{"id":"ex10","n":10,"level":2,"prompt":"Use the distributive property to find the value.","q":"8 × 102","aria":"8 × 102","options":[{"v":"816","ok":true,"why":""},{"v":"802","ok":false,"why":"You multiplied only the 100 by 8."},{"v":"1600","ok":false,"why":"You multiplied 100 by 2 instead of adding the parts."},{"v":"96","ok":false,"why":"102 is 100 + 2, not 10 + 2."}]},{"id":"ex11","n":11,"level":3,"prompt":"Use the distributive property to expand.","q":"−(x − 6)","aria":"−(x − 6)","options":[{"v":"−x + 6","ok":true,"why":""},{"v":"−x − 6","ok":false,"why":"(−1) · (−6) is +6. The negative flips both signs."},{"v":"x − 6","ok":false,"why":"You ignored the negative sign in front."},{"v":"x + 6","ok":false,"why":"You flipped the 6 but not the x."}]},{"id":"ex12","n":12,"level":3,"prompt":"Use the distributive property to expand.","q":"2(3x + 4y − 5)","aria":"2(3x + 4y − 5)","options":[{"v":"6x + 8y − 10","ok":true,"why":""},{"v":"6x + 4y − 5","ok":false,"why":"You multiplied only the first term by 2."},{"v":"6x + 8y − 5","ok":false,"why":"The 2 must reach the last term too: 2 · 5 = 10."},{"v":"6x + 8y + 10","ok":false,"why":"2 · (−5) is −10. The minus sign stays."}]},{"id":"ex13","n":13,"level":3,"prompt":"Use the distributive property backwards to find the value.","q":"17 × 6 + 17 × 4","aria":"17 × 6 + 17 × 4","options":[{"v":"170","ok":true,"why":""},{"v":"106","ok":false,"why":"You dropped the second 17."},{"v":"476","ok":false,"why":"You went straight left to right, so the 4 multiplied everything."},{"v":"44","ok":false,"why":"You added instead of multiplying."}]},{"id":"ex14","n":14,"level":3,"prompt":"Which property is shown?","q":"5(2 · x) = (5 · 2)x","aria":"5(2 · x) = (5 · 2)x","options":[{"v":"Associative","ok":true,"why":""},{"v":"Distributive","ok":false,"why":"Distributive needs a sum inside, like 5(2 + x). Here it's 2 · x, a product."},{"v":"Commutative","ok":false,"why":"The order is the same on both sides: 5, 2, x."}]},{"id":"ex15","n":15,"level":3,"prompt":"Use the distributive property to expand.","q":"−4(−2x + 3)","aria":"−4(−2x + 3)","options":[{"v":"8x − 12","ok":true,"why":""},{"v":"−8x − 12","ok":false,"why":"(−4) · (−2x) is +8x: negative times negative is positive."},{"v":"8x + 12","ok":false,"why":"(−4) · 3 is −12, not +12."},{"v":"8x + 3","ok":false,"why":"You multiplied only the first term by −4."}]},{"id":"ex16","n":16,"level":4,"prompt":"Use the properties to find the value.","q":"4 × 37 × 25","aria":"4 × 37 × 25","options":[{"v":"3700","ok":true,"why":""},{"v":"1073","ok":false,"why":"You added 4 and 25 instead of multiplying them."},{"v":"137","ok":false,"why":"You added the 37 instead of multiplying by it."},{"v":"148","ok":false,"why":"You forgot to multiply by 25."}]},{"id":"ex17","n":17,"level":4,"prompt":"Use the distributive property to find the value.","q":"9 × 99 + 9","aria":"9 × 99 + 9","options":[{"v":"900","ok":true,"why":""},{"v":"972","ok":false,"why":"You added 99 + 9 first, but multiplication comes before addition."},{"v":"891","ok":false,"why":"You left out the + 9 at the end."},{"v":"909","ok":false,"why":"Once the last 9 helps make 9 × 100, it is already counted."}]},{"id":"ex18","n":18,"level":4,"prompt":"Use the distributive property to expand.","q":"x(x + 5)","aria":"x(x + 5)","options":[{"v":"x<sup>2</sup> + 5x","ok":true,"why":""},{"v":"x<sup>2</sup> + 5","ok":false,"why":"You multiplied only the first term by x."},{"v":"2x + 5x","ok":false,"why":"x · x is x², not 2x. 2x means x + x."},{"v":"2x + 5","ok":false,"why":"x · x is x², and the 5 must be multiplied by x too."}]},{"id":"ex19","n":19,"level":4,"prompt":"Use the distributive property to expand.","q":"−5(2x − 3y + 1)","aria":"−5(2x − 3y + 1)","options":[{"v":"−10x + 15y − 5","ok":true,"why":""},{"v":"−10x − 15y − 5","ok":false,"why":"(−5) · (−3y) is +15y: negative times negative is positive."},{"v":"−10x − 3y + 1","ok":false,"why":"You multiplied only the first term by −5."},{"v":"−10x + 15y + 1","ok":false,"why":"−5 must reach the last term too: (−5) · 1 = −5."}]},{"id":"ex20","n":20,"level":4,"prompt":"Which property is shown?","q":"(x + 3) · 2 = 2 · (x + 3)","aria":"(x + 3) · 2 = 2 · (x + 3)","options":[{"v":"Commutative","ok":true,"why":""},{"v":"Distributive","ok":false,"why":"Distributing would give 2x + 6. Here the parentheses stay; the 2 just moved to the front."},{"v":"Associative","ok":false,"why":"Associative regroups three or more things. Here two factors just swapped."}]}]};
const KEY = "algebra." + DATA.setId + ".v1";
const N = DATA.exercises.length;
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  kids.flat().forEach((c) => e.append(c));
  return e;
};

// ---- state: results[i] = null | "first" | "retry"; order[i] = shuffled option indexes
let state = { i: 0, results: Array(N).fill(null), done: false };
let order = [];
let wrongPicks = [];      // option indexes already tried on the current exercise
let solved = false;
let videoOpen = false;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.results) && s.results.length === N) state = s;
  } catch (e) {}
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderDots() {
  const ul = $("#dots"); ul.innerHTML = "";
  DATA.exercises.forEach((ex, i) => {
    const b = el("button", {
      type: "button", "data-s": state.results[i] || "", "aria-label": `Exercise ${i + 1}` + (state.results[i] === "first" ? ", right on the first try" : state.results[i] === "retry" ? ", needed another try" : ""),
      onclick: () => go(i),
    }, String(i + 1));
    if (!state.done && i === state.i) b.setAttribute("aria-current", "step");
    ul.append(el("li", {}, b));
  });
}

function go(i) { state.i = i; state.done = false; save(); show(); }

function show() {
  renderDots();
  const app = $("#app"); app.innerHTML = "";
  $("#eyebrow").textContent = `Unit ${DATA.unit.split(".")[0]} · Lesson ${DATA.unit.split(".")[1]} · Practice`;
  if (state.done) return showResults(app);
  const ex = DATA.exercises[state.i];
  order = shuffled(ex.options.length);
  wrongPicks = []; solved = false; videoOpen = false;

  const card = el("section", { class: "card", "aria-labelledby": "qtitle" });
  card.append(el("div", { class: "meta" },
    el("span", {}, "Exercise ", el("b", {}, String(ex.n)), ` of ${N}`),
    el("span", { class: "level", "data-l": ex.level }, DATA.levels[ex.level])));
  if (ex.prompt) card.append(el("p", { class: "prompt" }, ex.prompt));
  else card.append(el("p", { class: "prompt" }, "What is the value of this expression?"));
  const q = el("div", { class: "q", id: "qtitle", role: "img", "aria-label": ex.aria, tabindex: "-1", html: ex.q });
  card.append(q);

  const opts = el("div", { class: "options", role: "group", "aria-label": "Answer choices" });
  order.forEach((oi, pos) => {
    const o = ex.options[oi];
    opts.append(el("button", { type: "button", class: "opt", "data-oi": oi, onclick: () => pick(oi) },
      el("span", { class: "k", "aria-hidden": "true" }, "ABCD"[pos]), el("span", { html: o.v })));
  });
  card.append(opts);
  card.append(el("div", { class: "fb", id: "fb", "aria-live": "polite" }));
  app.append(card);
  q.focus({ preventScroll: true });
}

function pick(oi) {
  if (solved || wrongPicks.includes(oi)) return;
  const ex = DATA.exercises[state.i];
  const o = ex.options[oi];
  const btn = document.querySelector(`.opt[data-oi="${oi}"]`);
  const fb = $("#fb");
  if (o.ok) {
    solved = true;
    btn.dataset.r = "right";
    document.querySelectorAll(".opt").forEach((b) => { b.disabled = true; });
    if (!state.results[state.i]) state.results[state.i] = wrongPicks.length ? "retry" : "first";
    save(); renderDots();
    fb.innerHTML = "";
    fb.append(el("div", { class: "note good" },
      el("strong", {}, wrongPicks.length ? "Right — and now you know why." : "Right on the first try!"),
      state.i < N - 1 ? "Ready for the next one?" : "That was the last one."));
    if (!videoOpen) fb.append(el("button", { type: "button", class: "link", onclick: (e) => { e.target.remove(); showVideo(false); } }, "Watch the step-by-step solution"));
    fb.append(el("div", { class: "actions" },
      el("button", { type: "button", class: "btn", id: "next", onclick: next }, state.i < N - 1 ? "Next exercise →" : "See my results")));
    $("#next").focus({ preventScroll: false });
  } else {
    wrongPicks.push(oi);
    btn.dataset.r = "wrong"; btn.disabled = true;
    if (!state.results[state.i]) { state.results[state.i] = "retry"; save(); renderDots(); }
    fb.innerHTML = "";
    fb.append(el("div", { class: "note bad", role: "status" }, el("strong", {}, "Not quite."), o.why));
    showVideo(true);
    fb.append(el("p", { class: "hint" }, "Watch how it is solved, then pick again."));
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function showVideo(autoplay) {
  if (videoOpen) return;
  videoOpen = true;
  const ex = DATA.exercises[state.i];
  const src = `../../videos/${DATA.setId}-${ex.id}/video.html` + (autoplay ? "?autoplay=1" : "");
  const box = el("div", { class: "vid" }, el("iframe", { src, title: `Step-by-step solution to exercise ${ex.n}`, allow: "autoplay; fullscreen", allowfullscreen: "", referrerpolicy: "no-referrer" }));
  const fb = $("#fb");
  const note = fb.querySelector(".note");
  note ? note.after(box) : fb.prepend(box);
}

function next() {
  if (state.i < N - 1) { state.i++; save(); show(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else { state.done = true; save(); show(); window.scrollTo({ top: 0 }); }
}

function showResults(app) {
  const first = state.results.filter((r) => r === "first").length;
  const answered = state.results.filter(Boolean).length;
  const card = el("section", { class: "card" });
  card.append(el("div", { class: "meta" }, el("span", {}, "Results")));
  card.append(el("div", { class: "score" }, String(first), el("small", {}, ` / ${N} on the first try`)));
  if (answered < N) card.append(el("p", {}, `${N - answered} exercise${N - answered === 1 ? "" : "s"} not tried yet.`));
  const ul = el("ul", { class: "bylevel" });
  Object.entries(DATA.levels).forEach(([l, name]) => {
    const idx = DATA.exercises.map((e, i) => (String(e.level) === l ? i : -1)).filter((i) => i >= 0);
    const ok = idx.filter((i) => state.results[i] === "first").length;
    ul.append(el("li", {}, el("span", {}, name), el("b", {}, `${ok} / ${idx.length}`)));
  });
  card.append(ul);
  const missed = state.results.map((r, i) => (r !== "first" ? i : -1)).filter((i) => i >= 0);
  const actions = el("div", { class: "actions" });
  if (missed.length) actions.append(el("button", { type: "button", class: "btn", onclick: () => { state.results = state.results.map((r) => (r === "first" ? r : null)); go(missed[0]); } },
    `Try the ${missed.length} I missed again`));
  actions.append(el("button", { type: "button", class: missed.length ? "btn ghost" : "btn", onclick: () => { state = { i: 0, results: Array(N).fill(null), done: false }; save(); show(); } }, "Start over"));
  card.append(actions);
  app.append(card);
}

document.addEventListener("keydown", (e) => {
  if (state.done || solved || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k < 0 || e.target.closest && e.target.closest("iframe")) return;
  const oi = order[k % 4];
  if (oi !== undefined) pick(oi);
});

load();
if (state.results.every(Boolean) && !state.done) { state.done = true; }
show();
</script>
</body>
</html>
